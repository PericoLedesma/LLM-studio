version: '3.8'

services:
  quickstart-app:
    build:
      context: ./quickstart
      dockerfile: Dockerfile
    container_name: quickstart-container
    ports:
      - "8000:8000"
    environment:
      - FLASK_APP=app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
    volumes:
      - ./quickstart:/app
    restart: unless-stopped
